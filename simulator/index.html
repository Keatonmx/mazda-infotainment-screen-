<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazda Connect Simulator</title>
<link rel="stylesheet" href="../apps/app.gtdash/app.css">
<style>
    body { margin: 0; padding: 16px; background: #15161a; color: #ddd; font-family: sans-serif; }
    #screen { position: relative; width: 800px; height: 480px; background: #000; overflow: hidden;
              border: 10px solid #2a2b30; border-radius: 12px; transform-origin: top left; }
    #frame { overflow: hidden; }
    #canvas { position: absolute; inset: 0; }
    #statusbar { position: absolute; top: 0; left: 0; right: 0; height: 64px; line-height: 64px;
                 padding: 0 24px; background: #0b0b0b; border-bottom: 1px solid #222; font-size: 22px;
                 z-index: 2; display: flex; justify-content: space-between; }
    .panel { max-width: 820px; margin-top: 16px; display: grid;
             grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 20px; }
    label { font-size: 13px; color: #aaa; display: block; }
    input[type=range] { width: 100%; }
    .knob { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #2a2b30; color: #eee; border: 1px solid #3a3b40; border-radius: 6px;
             padding: 8px 12px; font-size: 14px; cursor: pointer; }
    p.help { font-size: 13px; color: #888; max-width: 820px; }
</style>
</head>
<body>
<div id="frame"><div id="screen">
    <div id="statusbar"><span id="title"></span><span id="clock"></span></div>
    <div id="canvas"></div>
</div></div>

<div class="knob">
    <button data-ev="ccw">⟲ Rotate left</button>
    <button data-ev="cw">Rotate right ⟳</button>
    <button data-ev="upStart">▲ Up</button>
    <button data-ev="downStart">▼ Down</button>
    <button data-ev="leftStart">◀ Left</button>
    <button data-ev="rightStart">Right ▶</button>
    <button data-ev="selectStart">● Press</button>
    <button id="region">Region: NA</button>
    <button id="reset">Clear saved data</button>
</div>
<p class="help">Keyboard: <b>[</b> / <b>]</b> or mouse wheel over the screen = rotate knob, arrow keys = tilt, Enter = press.
Sliders send values in the units the CASDK reports (°C, km, %).</p>

<div class="panel" id="sliders"></div>

<script src="casdk-stub.js"></script>
<script>
    var sliders = [
        {label: 'Coolant (°C)', field: VehicleData.temperature.coolant, min: -10, max: 115, value: 35},
        {label: 'Intake air (°C)', field: VehicleData.temperature.intake, min: -10, max: 70, value: 22},
        {label: 'Outside (°C)', field: VehicleData.temperature.outside, min: -30, max: 45, value: 18},
        {label: 'Fuel (%)', field: VehicleData.fuel.position, min: 0, max: 100, value: 62},
        {label: 'Avg economy (L/100km)', field: VehicleData.fuel.averageconsumption, min: 4, max: 15, step: 0.1, value: 7.4},
        {label: 'Battery', field: VehicleData.vehicle.batterylevel, min: 0, max: 100, value: 88},
        {label: 'Odometer (km)', field: VehicleData.vehicle.odometer, min: 100000, max: 200000, value: 145000}
    ];
</script>
<script src="../apps/app.gtdash/app.js"></script>
<script>
    var panel = document.getElementById('sliders');
    sliders.forEach(function(s) {
        var wrap = document.createElement('div');
        var label = document.createElement('label');
        var input = document.createElement('input');
        input.type = 'range'; input.min = s.min; input.max = s.max; input.step = s.step || 1; input.value = s.value;
        function send() { label.textContent = s.label + ': ' + input.value; Sim.push(s.field, input.value); }
        input.addEventListener('input', send);
        wrap.appendChild(label); wrap.appendChild(input); panel.appendChild(wrap);
        send();
    });

    document.querySelectorAll('[data-ev]').forEach(function(b) {
        b.addEventListener('click', function() { Sim.controller(b.getAttribute('data-ev')); });
    });

    var keys = {'[': 'ccw', ']': 'cw', ArrowUp: 'upStart', ArrowDown: 'downStart',
                ArrowLeft: 'leftStart', ArrowRight: 'rightStart', Enter: 'selectStart'};
    document.addEventListener('keydown', function(e) {
        if (keys[e.key]) { e.preventDefault(); Sim.controller(keys[e.key]); }
    });
    document.getElementById('screen').addEventListener('wheel', function(e) {
        e.preventDefault(); Sim.controller(e.deltaY > 0 ? 'cw' : 'ccw');
    }, {passive: false});

    document.getElementById('region').addEventListener('click', function() {
        Sim.setRegion(Sim.region === 'na' ? 'eu' : 'na');
        this.textContent = 'Region: ' + Sim.region.toUpperCase();
    });
    document.getElementById('reset').addEventListener('click', function() { Sim.resetStorage(); });

    function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}); }
    tick(); setInterval(tick, 10000);

    function fit() {
        var scale = Math.min(1, (window.innerWidth - 32) / 820);
        var screen = document.getElementById('screen');
        var frame = document.getElementById('frame');
        screen.style.transform = 'scale(' + scale + ')';
        frame.style.width = (820 * scale) + 'px';
        frame.style.height = (500 * scale) + 'px';
    }
    window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
